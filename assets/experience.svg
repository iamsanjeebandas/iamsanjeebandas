<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="639" viewBox="0 0 1200 639"><defs><style>@font-face{font-family:JBM;font-weight:400;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:JBM;font-weight:700;src:url(data:font/woff2;base64,) format('woff2')}</style><pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="14" cy="14" r="1" fill="#FFFFFF" fill-opacity="0.045"/></pattern></defs><rect x="0.5" y="0.5" width="1199" height="638" rx="16" fill="#0D0F14" stroke="#1E2130"/><circle cx="40" cy="49" r="7" fill="#0D0F14" stroke="#00C2FF" stroke-width="2.5"/><line x1="40" y1="49" x2="40" y2="538" stroke="#1E2130" stroke-width="2"/><text x="64" y="56" font-family="JBM" font-size="23" fill="#E8E6DF" font-weight="700" text-anchor="start" xml:space="preserve">Learning Crew</text><text x="1152" y="56" font-family="JBM" font-size="16" fill="#6B6F7A" font-weight="400" text-anchor="end" xml:space="preserve">Aug 2025 — Sep 2026</text><text x="64" y="88" font-family="JBM" font-size="17" fill="#00C2FF" font-weight="400" text-anchor="start" opacity="0.9" xml:space="preserve">Software Developer (Full-Stack) · Remote, Seoul-based startup</text><text x="64" y="124" font-family="JBM" font-size="17" fill="#00C2FF" font-weight="400" text-anchor="start" xml:space="preserve">›</text><text x="86" y="124" font-family="JBM" font-size="17" fill="#6B6F7A" font-weight="400" text-anchor="start" xml:space="preserve">Took an inherited MVP into live operation for a global automotive client: assessment workflows,</text><text x="86" y="151" font-family="JBM" font-size="17" fill="#6B6F7A" font-weight="400" text-anchor="start" xml:space="preserve">weighted scoring, reports, admin dashboard, JWT auth, and role-based access control.</text><text x="64" y="188" font-family="JBM" font-size="17" fill="#00C2FF" font-weight="400" text-anchor="start" xml:space="preserve">›</text><text x="86" y="188" font-family="JBM" font-size="17" fill="#6B6F7A" font-weight="400" text-anchor="start" xml:space="preserve">Wrote a large share of the attendance and leave features for an internal HR platform; wrapped</text><text x="86" y="215" font-family="JBM" font-size="17" fill="#6B6F7A" font-weight="400" text-anchor="start" xml:space="preserve">multi-step writes in transactions and closed access-control gaps before production.</text><text x="64" y="252" font-family="JBM" font-size="17" fill="#00C2FF" font-weight="400" text-anchor="start" xml:space="preserve">›</text><text x="86" y="252" font-family="JBM" font-size="17" fill="#6B6F7A" font-weight="400" text-anchor="start" xml:space="preserve">Built a full-stack website end to end and worked with the team in Korea on requirements, code review,</text><text x="86" y="279" font-family="JBM" font-size="17" fill="#6B6F7A" font-weight="400" text-anchor="start" xml:space="preserve">deployment, and fixes.</text><text x="64" y="316" font-family="JBM" font-size="17" fill="#00C2FF" font-weight="400" text-anchor="start" xml:space="preserve">›</text><text x="86" y="316" font-family="JBM" font-size="17" fill="#6B6F7A" font-weight="400" text-anchor="start" xml:space="preserve">400+ commits across the two largest platforms. Reference from Learning Crew's CEO available on request.</text><circle cx="40" cy="376" r="7" fill="#0D0F14" stroke="#00C2FF" stroke-width="2.5"/><text x="64" y="383" font-family="JBM" font-size="23" fill="#E8E6DF" font-weight="700" text-anchor="start" xml:space="preserve">EPAM Systems</text><text x="1152" y="383" font-family="JBM" font-size="16" fill="#6B6F7A" font-weight="400" text-anchor="end" xml:space="preserve">Sep 2024 — Jun 2025</text><text x="64" y="415" font-family="JBM" font-size="17" fill="#00C2FF" font-weight="400" text-anchor="start" opacity="0.9" xml:space="preserve">Junior Software Engineer Intern</text><text x="64" y="451" font-family="JBM" font-size="17" fill="#00C2FF" font-weight="400" text-anchor="start" xml:space="preserve">›</text><text x="86" y="451" font-family="JBM" font-size="17" fill="#6B6F7A" font-weight="400" text-anchor="start" xml:space="preserve">Built Spring Boot microservices (Spring Security/JWT, Hibernate, MongoDB/MySQL) on AWS in a 6-person</text><text x="86" y="478" font-family="JBM" font-size="17" fill="#6B6F7A" font-weight="400" text-anchor="start" xml:space="preserve">agile backend team; wrote JUnit/Mockito tests and took part in code reviews.</text><circle cx="40" cy="538" r="7" fill="#0D0F14" stroke="#00C2FF" stroke-width="2.5"/><text x="64" y="545" font-family="JBM" font-size="23" fill="#E8E6DF" font-weight="700" text-anchor="start" xml:space="preserve">SOA ITER, Bhubaneswar</text><text x="1152" y="545" font-family="JBM" font-size="16" fill="#6B6F7A" font-weight="400" text-anchor="end" xml:space="preserve">2021 — 2025</text><text x="64" y="577" font-family="JBM" font-size="17" fill="#00C2FF" font-weight="400" text-anchor="start" opacity="0.9" xml:space="preserve">B.Tech, Computer Science &amp; Information Technology · CGPA 8.83</text></svg>